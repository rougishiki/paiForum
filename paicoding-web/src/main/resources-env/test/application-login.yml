paicoding:
  login:
    zsxq:
      api: https://wx.zsxq.com/connector/crm/identify_member.html
      appId: ${ZSXQ_APP_ID:666}
      groupNumber: ${ZSXQ_GROUP_NUMBER:666}
      secret: ${ZSXQ_SECRET:666}
      redirectUrl: https://paicoding.com/login/zsxq/callback
    wx:
      loginQrType: SUBSCRIPTION_ACCOUNT # SUBSCRIPTION_ACCOUNT 表示普通的公众号登录  SERVICE_ACCOUNT 表示服务号关注登录
      appId: ${WX_APP_ID:wx59xffb8}
      appSecret: ${WX_APP_SECRET:a7c4x68c84}
      qrCodeImg: ${view.site.contactMeWxQrCode}
      qrCodeLogo: ${view.site.websiteLogoUrl}
      securityCheckToken: # 为空，表示不对微信回调的接口进行校验